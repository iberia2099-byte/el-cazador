<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>El Cazador</title>
<style>
:root{--bg:#f4f0e8;--fg:#221e19;--mut:#6b6358;--card:#e9e3d6;--ac:#8a2b1f;--bd:#cfc6b4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17140f;--fg:#e8e0d0;--mut:#9a9080;--card:#231f18;--ac:#c4543f;--bd:#3a332a;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#17140f;--fg:#e8e0d0;--mut:#9a9080;--card:#231f18;--ac:#c4543f;--bd:#3a332a;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.55 Georgia,"Times New Roman",serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:1.5rem;margin:.2em 0;letter-spacing:.04em}
.sub{color:var(--mut);margin:0 0 16px;font-style:italic}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:12px;margin:8px 0;cursor:pointer}
.card.sel{border-color:var(--ac);outline:2px solid var(--ac)}
.card b{display:block}.card small{color:var(--mut)}
input,button{font:inherit;color:var(--fg)}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--card)}
button{background:var(--ac);color:#fff;border:0;border-radius:8px;padding:10px 16px;cursor:pointer}
button:disabled{opacity:.5}
#log{margin:12px 0}
.m{margin:12px 0;white-space:pre-wrap}
.me{color:var(--mut);font-style:italic;border-left:3px solid var(--ac);padding-left:10px}
details{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:8px 12px;font-size:.9rem}
summary{cursor:pointer}
#roll{margin:8px 0}
.row{display:flex;gap:8px;margin-top:8px}
.sys{color:var(--ac);font-weight:bold}
.img{margin:12px 0;border:1px solid var(--bd);border-radius:10px;overflow:hidden;background:#15120e;color:var(--mut);text-align:center;font-size:.85rem;font-style:italic;min-height:60px;line-height:60px}
.img img{width:100%;display:block;aspect-ratio:1.18/1;object-fit:cover}
.img{box-shadow:0 10px 28px rgba(0,0,0,.28);border-color:#514638}
.img:not(.ai) img{filter:contrast(1.04) saturate(.88)}
.scene-caption{padding:7px 10px;background:rgba(10,9,8,.92);color:#d8cbb8;text-align:left;font:12px/1.3 Georgia,serif;letter-spacing:.04em}
.img.ai{position:relative;background:#0b0908;min-height:220px}
.img.ai::after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,rgba(255,255,255,.03),rgba(0,0,0,.12));mix-blend-mode:soft-light}
.img.ai img{aspect-ratio:16/9;object-fit:cover}

</style></head>
<body><main>
<h1>EL CAZADOR</h1>
<p class="sub">Un contrato, un monstruo, y la verdad que nadie quiere oír.</p>
<p id="modeNote" class="sub">Narrador IA conectado · Las partidas se guardan en este navegador.</p>

<section id="start">
<p>Elige tu trasfondo:</p>
<div id="bgs"></div>
<input id="name" placeholder="Nombre del cazador" maxlength="30" style="margin-top:8px">
<div class="row"><button id="go">Comenzar</button></div>
<p id="err" class="sys"></p>
</section>

<section id="game" hidden>
<details><summary id="sum">Ficha</summary><div id="sheet"></div></details>
<div id="log"></div>
<div id="roll"></div>
<div class="row"><input id="act" placeholder="¿Qué haces?"><button id="send">Actuar</button></div>
<div class="row">
<button id="saveGame">Guardar partida</button>
<button id="exportGame">Descargar partida</button>
 <button id="importGame">Cargar partida</button>
<input id="importFile" type="file" accept=".json,application/json" hidden>
</div>
<p id="saveStatus" class="sys"></p>
<p id="err2" class="sys"></p>
</section>
</main>
<script>
var BG=[
{id:"soldado",n:"Ex-soldado",a:{fuerza:4,agilidad:2,astucia:1,voluntad:3},t:"Disciplina en combate; la nobleza lo desprecia por desertor.",eq:["espada de acero","jubón acolchado"]},
{id:"ladron",n:"Ladrón reformado",a:{fuerza:1,agilidad:4,astucia:3,voluntad:2},t:"Conoce los bajos fondos; algunos acreedores aún lo buscan.",eq:["daga","ganzúas"]},
{id:"erudito",n:"Erudito expulsado",a:{fuerza:1,agilidad:2,astucia:4,voluntad:3},t:"Sabe de bestiario y textos antiguos; es físicamente frágil.",eq:["bastón","bestiario incompleto"]},
{id:"leñador",n:"Hijo de leñadores",a:{fuerza:3,agilidad:3,astucia:2,voluntad:2},t:"Rastreo y supervivencia; ignora la política y la etiqueta.",eq:["hacha","arco corto"]},
{id:"acolito",n:"Ex-acólito",a:{fuerza:2,agilidad:1,astucia:3,voluntad:4},t:"Resiste el miedo y lo oculto; arrastra una fe quebrada.",eq:["maza","símbolo sagrado roto"]},
{id:"linaje",n:"Cazador de linaje",a:{fuerza:3,agilidad:3,astucia:1,voluntad:3},t:"Hereda el equipo de su padre, y también sus enemigos.",eq:["espada de plata","aceite para bestias"]}
];
var HER=["Ileso","Magullado","Herido","Malherido","Moribundo"];
var S=null,sel=null,pend=null,busy=false;

try {
 var partida=localStorage.getItem("cazador");
 if(partida){
  var guardada=JSON.parse(partida);
  if(guardada && guardada.nombre && Array.isArray(guardada.hist)){
   S=guardada;
  }
 }
} catch(e) {
 S=null;
}
var $=function(i){return document.getElementById(i)};
var SYS=`Eres el Narrador de un juego de rol de texto de grim fantasy (tono The Witcher): sobrio, sensorial, moral gris, mundo hostil y supersticioso, magia rara y con precio. El jugador es un cazador de monstruos a sueldo.
REGLAS: narra en segunda persona y presente, 80-150 palabras, sin humor moderno. Nunca decidas acciones, palabras o pensamientos del jugador; termina donde deba actuar. Ninguna opción es claramente buena; toda decisión cuesta algo. Los PNJ mienten y tienen motivos propios. El peligro es real. Respeta el ESTADO: no inventes objetos ni habilidades que no consten.
CICLO DE ENCARGO: contrato (cliente con intereses ocultos, pago negociable) > investigación (pistas verificables, algunas falsas) > preparación > caza (breve y peligrosa, el monstruo tiene punto débil) > consecuencias (el monstruo rara vez es lo que parece).
TIRADAS: si una acción es arriesgada, NO decidas el resultado: termina la narración con <tirada>{"atributo":"fuerza|agilidad|astucia|voluntad","dificultad":10-20}</tirada> y espera. El jugador te enviará el resultado (exito, exito con coste o fallo): narra exactamente ese nivel. Un éxito con coste cumple el objetivo pero cuesta algo.
FORMATO: tras la narración añade SIEMPRE, al final: <estado>{"ubicacion":"...","heridas":0,"monedas":0,"inv_add":[],"inv_del":[],"rep":{},"resumen":"una frase de lo ocurrido","escena":{"lugar":"bosque|aldea|cripta|taberna|pantano|montaña|castillo|camino","hora":"dia|atardecer|noche","clima":"despejado|niebla|lluvia|nieve","sujeto":"ninguno|lobo|bestia|espectro|arana|cuervos|hoguera|dragon|figura"}}</estado> donde heridas y monedas son cambios (+/-) y rep cambios de reputación por facción. No menciones estas etiquetas en la narración.`;

BG.forEach(function(b){
 var d=document.createElement("div");d.className="card";
 d.innerHTML="<b>"+b.n+"</b><small>Fue "+b.a.fuerza+" · Agi "+b.a.agilidad+" · Ast "+b.a.astucia+" · Vol "+b.a.voluntad+"<br>"+b.t+"</small>";
 d.onclick=function(){sel=b;[].forEach.call(document.querySelectorAll(".card"),function(c){c.classList.remove("sel")});d.classList.add("sel")};
 $("bgs").appendChild(d);
});

function save(){try{localStorage.setItem("cazador",JSON.stringify(S))}catch(e){}}
 $("saveGame").onclick=function(){
 if(!S)return;
 save();
 $("saveStatus").textContent="Partida guardada correctamente.";
};

$("exportGame").onclick=function(){
 if(!S)return;
 var copia={
  juego:"El Cazador",
  fecha:new Date().toISOString(),
  partida:S
 };
 var archivo=new Blob(
  [JSON.stringify(copia,null,2)],
  {type:"application/json"}
 );
 var enlace=document.createElement("a");
 enlace.href=URL.createObjectURL(archivo);
 enlace.download="El-Cazador-"+S.nombre+".json";
 enlace.click();
 URL.revokeObjectURL(enlace.href);
 $("saveStatus").textContent="Copia descargada.";
};
 $("importGame").onclick=function(){
 $("importFile").click();
};

$("importFile").onchange=function(){
 var archivo=this.files[0];
 if(!archivo)return;

 var lector=new FileReader();

 lector.onload=function(){
  try{
   var datos=JSON.parse(lector.result);
   var partida=datos.partida||datos;

   if(!partida.nombre ||
      !Array.isArray(partida.hist) ||
      !partida.a ||
      !Array.isArray(partida.inv)){
    throw new Error("Archivo de partida no válido");
   }

   S=partida;
   pend=null;
   $("start").hidden=true;
   $("game").hidden=false;
   $("log").innerHTML="";
   $("roll").innerHTML="";

   S.hist.forEach(function(h){
    add(h.t,h.r==="j"?"me":"");
   });

   sheet();

   save();
   $("saveStatus").textContent="Partida cargada correctamente: "+S.nombre;
  }catch(e){
   $("saveStatus").textContent="No se pudo cargar: archivo no válido.";
  }
 };

 lector.readAsText(archivo);
 this.value="";
};
function sheet(){
 var a=S.a;
 $("sum").textContent=S.nombre+" · "+HER[S.heridas]+" · "+S.monedas+" monedas";
 $("sheet").innerHTML="<p><b>"+S.nombre+"</b>, "+S.bg+"<br>Fuerza "+a.fuerza+" · Agilidad "+a.agilidad+" · Astucia "+a.astucia+" · Voluntad "+a.voluntad+"</p><p>Estado: "+HER[S.heridas]+"<br>Lugar: "+S.ubicacion+"<br>Equipo: "+(S.inv.join(", ")||"nada")+"<br>Reputación: "+(Object.keys(S.rep).map(function(k){return k+" "+S.rep[k]}).join(", ")||"nadie te conoce")+"</p>";
}
function add(txt,cls){var d=document.createElement("div");d.className="m "+(cls||"");d.textContent=txt;$("log").appendChild(d);d.scrollIntoView({block:"nearest"});return d}
if(S){
 $("start").hidden=true;
 $("game").hidden=false;
 sheet();
 $("log").innerHTML="";
 (S.hist||[]).forEach(function(h){
  add(h.t,h.r==="j"?"me":"");
 });
  
  var escena=document.createElement("div");
  drawScene(S.esc,escena);
  $("log").appendChild(escena);
 }
}
 function clean(t){return t.replace(/<estado[\s\S]*$/,"").replace(/<tirada[\s\S]*$/,"").trim()}


function prompt(user){
 var h=S.hist.slice(-16).map(function(m){
  return (m.r==="n"?"NARRADOR: ":"JUGADOR: ")+m.t
 }).join("\n");

 var est={
  nombre:S.nombre,
  trasfondo:S.bg,
  atributos:S.a,
  salud:HER[S.heridas],
  monedas:S.monedas,
  inventario:S.inv,
  reputacion:S.rep,
  ubicacion:S.ubicacion,
  escena:S.esc||null,
  tirada_pendiente:pend||null
 };

 return SYS+
 "\n\nESTADO ACTUAL DEL PERSONAJE:\n"+
 JSON.stringify(est)+
 "\n\nRESUMEN DE LA AVENTURA:\n"+
 (S.res.slice(-20).join(" ")||"(inicio)")+
 "\n\nHISTORIAL RECIENTE:\n"+
 h+
 "\n\nINSTRUCCIONES DE CONTINUIDAD:\n"+
 "Continúa exactamente desde el último acontecimiento. "+
 "No reinicies la aventura ni repitas escenas, conversaciones o "+
 "presentaciones ya realizadas. Respeta los personajes conocidos, "+
 "las decisiones del jugador, el inventario, las heridas, las monedas "+
 "y la ubicación actual. Mantén la coherencia con todo el historial "+
 "y el estado proporcionado.\n\n"+
 "JUGADOR: "+user+
 "\n\nResponde como NARRADOR.";
}

function offlineResponse(user){
 var first=S.hist.length===0;
 var place=S.ubicacion||"el camino";
 var low=String(user||"").toLowerCase();
 var scene={lugar:"aldea",hora:"atardecer",clima:"niebla",sujeto:"figura"};
 if(/bosque|arbol|rastrea|huella/.test(low)){scene.lugar="bosque";scene.sujeto="lobo";}
 if(/cripta|tumba|catacumba|muerto/.test(low)){scene.lugar="cripta";scene.sujeto="espectro";}
 if(/taberna|posada|beber|preguntar/.test(low)){scene.lugar="taberna";scene.sujeto="hoguera";}
 if(/pantano|agua|ciénaga|ciénaga/.test(low)){scene.lugar="pantano";scene.sujeto="bestia";}
 if(/noche|oscuro|anochece/.test(low))scene.hora="noche";
 if(/lluvia|llueve/.test(low))scene.clima="lluvia";
 var narration;
 if(first){
  narration="El camino se estrecha entre campos anegados y cercas vencidas. Al caer la tarde, las primeras casas de la aldea aparecen detrás de una cortina de niebla. No hay humo en las chimeneas. Un perro flaco te observa desde debajo de un carro y después desaparece. En la plaza, una mujer de luto aguarda junto al pozo; aprieta un pequeño medallón de hierro y mira tu espada antes de mirarte a la cara. «Si de verdad eres cazador, quizá puedas ayudarme», dice. No ofrece todavía una recompensa. Desde la calleja llega un golpe seco, seguido de silencio.";
 }else{
  var action=user.replace(/^\[RESULTADO[^\]]*\]\s*/i,"");
  if(/RESULTADO DE LA TIRADA/.test(user)){
   narration=/exito(?! con coste)/i.test(user)?"Tu movimiento alcanza su objetivo. El peligro cede por un instante, pero el silencio que queda no inspira confianza. Algo se ha desplazado más allá de tu vista. Puedes aprovechar la abertura, examinar el lugar o retirarte antes de que la situación empeore.":/exito con coste/i.test(user)?"Consigues lo que buscabas, aunque el precio se hace evidente de inmediato. Un dolor agudo te recorre el cuerpo y algo de tu equipo queda dañado. El camino sigue abierto, pero la criatura ya sabe dónde estás.":"Tu intento fracasa. El enemigo se adelanta y te obliga a retroceder. El golpe no te derriba, aunque notas cómo la herida y el cansancio pesan más. Tendrás que cambiar de táctica o buscar una salida.";
  }else{
   narration="Te concentras en tu siguiente movimiento. "+(action?"«"+action+"». ":"")+"La aldea parece contener el aliento. Tras una contraventana alguien escucha; en la plaza, la mujer de luto no aparta los ojos de ti. Una marca oscura cruza el barro junto al pozo y se pierde hacia las casas abandonadas. No basta para saber qué acecha aquí, pero sí para sospechar que el relato que te han contado está incompleto. Puedes seguir el rastro, hablar con los vecinos o preparar el equipo antes de internarte en la niebla.";
  }
 }
 return narration+"\n<estado>"+JSON.stringify({ubicacion:scene.lugar,heridas:0,monedas:0,inv_add:[],inv_del:[],rep:{},resumen:narration.slice(0,110),escena:scene})+"</estado>";
}
async function turn(user,show){
 if(busy)return;busy=true;$("send").disabled=true;$("err2").textContent="";$("roll").innerHTML="";
 if(show)add(show,"me");
 var out=add("…");
 try{
  var response=await fetch("https://el-cazador-ia.iberia2099.workers.dev",{
   method:"POST",
   headers:{"Content-Type":"application/json"},
   body:JSON.stringify({prompt:prompt(user)})
  });
  var data=await response.json();
  if(!response.ok)throw new Error(data.detail||data.error||("Error HTTP "+response.status));
  if(!data.text)throw new Error("El narrador no ha devuelto texto.");
  var raw=data.text;
  var nar=clean(raw);
  out.textContent=nar;
  S.hist.push({r:"j",t:user},{r:"n",t:nar});
  var m=raw.match(/<estado>([\s\S]*?)<\/estado>/);
  if(m){try{var e=JSON.parse(m[1]);
   if(e.ubicacion)S.ubicacion=e.ubicacion;
   S.heridas=Math.max(0,Math.min(4,S.heridas+(+e.heridas||0)));
   S.monedas=Math.max(0,S.monedas+(+e.monedas||0));
   (e.inv_add||[]).forEach(function(x){S.inv.push(x)});
   (e.inv_del||[]).forEach(function(x){var i=S.inv.indexOf(x);if(i>-1)S.inv.splice(i,1)});
   Object.keys(e.rep||{}).forEach(function(k){S.rep[k]=(S.rep[k]||0)+(+e.rep[k]||0)});
   if(e.resumen)S.res.push(e.resumen);S.esc=e.escena||S.esc;
  }catch(x){}}
  drawScene(S.esc,out);
   var t=raw.match(/<tirada>([\s\S]*?)<\/tirada>/);
  if(t){try{pend=JSON.parse(t[1]);showRoll()}catch(x){pend=null}}else pend=null;
  if(S.heridas>=4)add("Estás al borde de la muerte.","sys");
  sheet();save();
 }catch(e){out.remove();$("err2").textContent="Falló el narrador: "+((e&&e.message)||((e&&e.code)||"error"))+". Comprueba la conexión o vuelve a intentarlo.";}
 busy=false;$("send").disabled=false;
}
async function sceneAI(txt,el){
  var box=null;
  if(typeof claude==="undefined"||!claude||typeof claude.use!=="function")return false;
  if(!el||!el.parentNode)return false;
  try{
    var sample=await claude.use("sample");
    if(!sample||!el.parentNode)return;
    box=document.createElement("div");
    box.className="img ai";
    box.textContent="Ilustrando la escena…";
    el.parentNode.insertBefore(box,el);

    var prompt=`Crea una ILUSTRACIÓN SVG MUY REALISTA, detallada y cinematográfica de fantasía oscura para el juego de rol "EL CAZADOR".
ESTILO VISUAL CONSTANTE:
- fantasía oscura adulta, realista y sobria
- aspecto de fotograma de película de fantasía medieval, concept art realista de alto detalle
- luz dramática, niebla, lluvia, polvo o partículas atmosféricas según corresponda
- paleta apagada de tierras, negros, grises y rojos oxidados
- contraste fuerte, volumen y profundidad
- composición panorámica 16:9
- rostros, ropa, armaduras, arquitectura, animales y anatomía natural muy detallados; evita siluetas esquemáticas
- nada de formas geométricas simples, pictogramas, siluetas abstractas, cartoon, anime, cómic infantil ni videojuego genérico
- NO texto, letras, UI, marcos ni símbolos escritos

REGLA DE CONTINUIDAD:
El personaje principal es SIEMPRE el mismo cazador. Su aspecto debe ser coherente con el trasfondo, equipo y estado descritos en el texto.
No inventes elementos importantes que contradigan la escena.

La ilustración debe representar EL MOMENTO MÁS IMPORTANTE del texto, no una portada genérica.
Puedes usar gradientes, filtros, trazados, formas y texturas SVG para conseguir profundidad.
Responde SOLO con un único <svg viewBox="0 0 800 450" xmlns="http://www.w3.org/2000/svg">...</svg>.
Máximo 12000 caracteres.

ESCENA:
${txt}`;

    var r=await sample(prompt,{modelTier:"quick",cache:false});
    var m=(r.text||"").match(/<svg[\s\S]*<\/svg>/i);
    if(!m||/<script|on[a-z]+\s*=|javascript:|href\s*=|foreignObject/i.test(m[0])){
      box.remove(); return false;
    }

    var im=document.createElement("img");
    im.alt="Ilustración de la escena";
    im.loading="lazy";
    im.src="data:image/svg+xml;charset=utf-8,"+encodeURIComponent(m[0]);
    box.textContent="";
    box.appendChild(im);
    return true;
  }catch(e){
    if(box)box.remove();
    return false;
  }
}

function drawScene(es,el){
 es=es||{};
 var L=String(es.lugar||'aldea').toLowerCase();
 var key='aldea',label='Aldea medieval';
 if(L==='bosque'||L==='camino'){key='bosque';label=L==='camino'?'Camino entre bosques':'Bosque';}
 else if(L==='taberna'){key='taberna';label='Taberna';}
 else if(L==='cripta'){key='cripta';label='Cripta';}
 else if(L==='pantano'){key='pantano';label='Pantano';}
 else if(L==='castillo'||L==='montaña'){key='castillo';label=L==='montaña'?'Fortaleza en las montañas':'Castillo';}
 var box=document.createElement('div');
 box.className='img';
 box.style.lineHeight='normal';
 box.style.background='#111';
 var im=document.createElement('img');
 im.alt='Escena realista de '+label.toLowerCase()+' en El Cazador';
 im.loading='lazy';
 im.src=SCENE_IMAGES[key];
 box.appendChild(im);
 var cap=document.createElement('div');
 cap.className='scene-caption';
 cap.textContent=label+(es.hora==='noche'?' · Noche':es.hora==='atardecer'?' · Atardecer':'');
 box.appendChild(cap);
 if(el&&el.parentNode)el.parentNode.insertBefore(box,el);
 return box;
}
function showRoll(){
 var b=document.createElement("button");
 b.textContent="Tirar dado ("+pend.atributo+", dificultad "+pend.dificultad+")";
 b.onclick=function(){
  var key=String(pend.atributo).toLowerCase().replace("á","a");
  var at=S.a[key]||2,d=Math.floor(Math.random()*20)+1,tot=d+at-S.heridas,dif=+pend.dificultad||15,lv;
  if(d===20||tot>=dif)lv="exito";else if(d!==1&&tot>=dif-3)lv="exito con coste";else lv="fallo";
  var txt="Dado "+d+" + "+at+(S.heridas?" − "+S.heridas+" por heridas":"")+" = "+tot+" contra "+dif+": "+lv;
  pend=null;
  turn("[RESULTADO DE LA TIRADA: "+lv+"]",txt);
 };
 $("roll").appendChild(b);
}
